steps:
  # 1. Installa i pacchetti usando Node 20
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['install']

  # 2. Configura e lancia la build con collegamento automatico
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm install -g eas-cli
        
        # Crea automaticamente il progetto su Expo se non esiste
        eas project:init --non-interactive || true
        
        # Avvia la build dell'APK di test
        eas build --platform android --profile preview --non-interactive
    secretEnv: ['EXPO_TOKEN']

# Recupera il token di Expo salvato su Google Cloud
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/EXPO_TOKEN/versions/latest
      env: 'EXPO_TOKEN'

# Forza Google Cloud a usare i log corretti
options:
  logging: CLOUD_LOGGING_ONLY
