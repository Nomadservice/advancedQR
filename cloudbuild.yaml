steps:
  # 1. Installa i pacchetti usando Node 20
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['install']

  # 2. Configura e lancia la build ufficiale sul nuovo account Expo
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm install -g eas-cli
        
        # Inizializza il progetto sul nuovo account nomadservice2
        eas project:init --account nomadservice2 --non-interactive || true
        
        # Avvia la build dell'APK di test pulendo la vecchia cache rotta
        eas build --platform android --profile preview --non-interactive --clear-cache
    secretEnv: ['EXPO_TOKEN']

# Recupera il token sicuro da Secret Manager
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/EXPO_TOKEN/versions/latest
      env: 'EXPO_TOKEN'

options:
  logging: CLOUD_LOGGING_ONLY
