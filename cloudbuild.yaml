steps:
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['install']

  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm install -g eas-cli
        export EXPO_TOKEN="6jPpG1F9dOmnTzofwzauMXykP7FIePm1wYcc64yk"
        
        # Sincronizza lo slug e l'account in modo automatico senza conflitti di permessi
        eas project:init --account nomadservice2 --non-interactive || true
        
        eas build --platform android --profile preview --non-interactive --clear-cache

options:
  logging: CLOUD_LOGGING_ONLY
