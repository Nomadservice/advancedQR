steps:
  # 1. Pulisce la cache e installa i pacchetti del progetto
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['cache', 'clean', '--force']

  - name: 'node:20'
    entrypoint: 'npm'
    args: ['install']

  # 2. Esegue la pre-compilazione generando la cartella nativa di Android
  - name: 'node:20'
    entrypoint: 'npx'
    args: ['expo', 'prebuild', '--platform', 'android', '--no-install']

  # 3. Rimuove in modo chirurgico solo la riga del plugin Facebook che fa crashare Gradle
  - name: 'gcr.io/cloud-builders/gradle'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cd android
        # Sostituisce la riga del plugin con uno spazio vuoto per non rompere il file
        sed -i 's/id("com.facebook.react.settings")//g' settings.gradle
        sed -i 's/id "com.facebook.react.settings"//g' settings.gradle
        ./gradlew assembleRelease
    dir: '.'

# Salva l'APK finito nel bucket di archiviazione di Google Cloud
artifacts:
  objects:
    location: 'gs://$PROJECT_ID-vcm/build-output/'
    paths: ['android/app/build/outputs/apk/release/*.apk']

options:
  logging: CLOUD_LOGGING_ONLY
