steps:
  # 1. Pulisce la cache e installa i pacchetti del progetto
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['cache', 'clean', '--force']

  - name: 'node:20'
    entrypoint: 'npm'
    args: ['install']

  # 2. Esegue la pre-compilazione generando la cartella nativa di Android
  - name: 'node:20'
    entrypoint: 'npx'
    args: ['expo', 'prebuild', '--platform', 'android', '--no-install']

  # 3. Sovrascrive il file settings.gradle con una struttura standard compatibile al 100% con Google Cloud
  - name: 'gcr.io/cloud-builders/gradle'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cd android
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PRESERVE_EXISTING)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = 'advancedqr'
        include ':app'
        includeBuild('../node_modules/@react-native/gradle-plugin')
        EOF
        ./gradlew assembleRelease
    dir: '.'

# Salva l'APK finito nel bucket di archiviazione di Google Cloud
artifacts:
  objects:
    location: 'gs://$PROJECT_ID-vcm/build-output/'
    paths: ['android/app/build/outputs/apk/release/*.apk']

options:
  logging: CLOUD_LOGGING_ONLY
