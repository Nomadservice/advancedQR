steps:
  # 1. Pulisce la cache e installa le dipendenze del progetto
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['cache', 'clean', '--force']

  - name: 'node:20'
    entrypoint: 'npm'
    args: ['install']

  # 2. Genera la cartella nativa di Android direttamente dentro Google Cloud
  - name: 'node:20'
    entrypoint: 'npx'
    args: ['expo', 'prebuild', '--platform', 'android', '--no-install']

  # 3. Compila l'APK nativo usando Gradle (Usa Java 17, richiesto dall'SDK 51)
  - name: 'gcr.io/cloud-builders/gradle'
    args: ['assembleRelease']
    dir: 'android'

artifacts:
  objects:
    location: 'gs://$PROJECT_ID-vcm/build-output/'
    paths: ['android/app/build/outputs/apk/release/*.apk']

options:
  logging: CLOUD_LOGGING_ONLY
