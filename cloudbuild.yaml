steps:
  # 1. Installa i pacchetti usando Node 20
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['install']

  # 2. Configura e lancia la build ufficiale su Expo
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm install -g eas-cli
        
        # Sostituisci NUOVO_ACCOUNT_EXPO con il nome del nuovo profilo gratuito
        eas project:init --account NUOVO_ACCOUNT_EXPO --non-interactive || true
        
        # Avvia la build dell'APK di test pulendo la cache
        eas build --platform android --profile preview --non-interactive --clear-cache
    secretEnv: ['EXPO_TOKEN']

# Recupera il token di Expo salvato su Google Cloud
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/EXPO_TOKEN/versions/latest
      env: 'EXPO_TOKEN'

options:
  logging: CLOUD_LOGGING_ONLY
