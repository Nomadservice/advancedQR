steps:
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['install']

  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm install -g eas-cli
        eas project:init --account nomadservice --non-interactive || true
        eas build --platform android --profile preview --non-interactive --clear-cache
    secretEnv: ['EXPO_TOKEN']

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/EXPO_TOKEN/versions/latest
      env: 'EXPO_TOKEN'

options:
  logging: CLOUD_LOGGING_ONLY
